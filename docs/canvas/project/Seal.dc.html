<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<title>Seal</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="olai.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..600&amp;family=Noto+Serif+Tamil:wdth,wght@62.5..100,100..900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<sc-if value="{{earned}}" hint-placeholder-val="{{true}}">
<div class="sealw" style="width: {{box}}; height: {{boxh}}">
<svg class="medal{{cls}}" style="display: block" width="{{px}}" height="{{pxh}}" viewBox="0 0 120 136" aria-hidden="true">
<defs>
<linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6DC9C"></stop><stop offset=".45" stop-color="#D3AE62"></stop><stop offset="1" stop-color="#9A7432"></stop></linearGradient>
<radialGradient id="en-{{tone}}" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="{{c1}}"></stop><stop offset="1" stop-color="{{c2}}"></stop></radialGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"></stop><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".45"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient>
<clipPath id="disc"><circle cx="60" cy="58" r="45"></circle></clipPath>
</defs>
<path d="M40 88L30 128 42 121 50 132 60 96Z" fill="{{c2}}"></path>
<path d="M80 88L90 128 78 121 70 132 60 96Z" fill="{{c3}}"></path>
<circle cx="60" cy="61" r="56" fill="#000000" opacity=".18"></circle>
<circle cx="60" cy="58" r="56" fill="url(#brass)"></circle>
<circle cx="60" cy="58" r="51.500" fill="none" stroke="#7E5C22" stroke-width="2.400" stroke-dasharray="0.01 6.740" stroke-linecap="round" opacity=".7"></circle>
<circle cx="60" cy="58" r="47" fill="#7E5C22" opacity=".55"></circle>
<circle cx="60" cy="58" r="45" fill="url(#en-{{tone}})"></circle>
<circle cx="60" cy="58" r="40.500" fill="none" stroke="#FFF4DF" stroke-width=".9" opacity=".35"></circle>
<path d="M27 46C33 28 49 19 66 20 52 25 38 34 31 52Z" fill="#FFFFFF" opacity=".16"></path>
<g clip-path="url(#disc)"><g transform="rotate(20 60 58)"><rect class="seal-shine" x="-60" y="-20" width="34" height="160" fill="url(#shine)"></rect></g></g>
</svg>
<span class="sealface" style="height: {{facebox}}; gap: {{gap}}"><span style="font-family: 'Noto Serif Tamil', serif; font-size: {{fpx}}; line-height: 1; color: #FFF4DF; text-shadow: 0 1px 0 rgba(0,0,0,.35)">{{glyph}}</span><sc-if value="{{hasNum}}" hint-placeholder-val="{{true}}"><span style="font-family: 'Literata', Georgia, serif; font-weight: 600; font-size: {{dpx}}; line-height: 1; color: #FFF4DF; opacity: .82">{{num}}</span></sc-if></span>
</div>
</sc-if>
<sc-if value="{{ahead}}" hint-placeholder-val="{{false}}">
<div class="sealw" style="width: {{box}}; height: {{boxh}}">
<svg class="medal ahead" style="display: block" width="{{px}}" height="{{pxh}}" viewBox="0 0 120 136" aria-hidden="true">
<circle cx="60" cy="58" r="54" fill="none" stroke="{{c1}}" stroke-opacity=".55" stroke-width="1.600" stroke-dasharray="3 5"></circle>
<circle cx="60" cy="58" r="44" fill="{{c1}}" fill-opacity=".09"></circle>
</svg>
<span class="sealface" style="height: {{facebox}}; gap: {{gap}}; color: {{c1}}; opacity: .6"><span style="font-family: 'Noto Serif Tamil', serif; font-size: {{fpx}}; line-height: 1">{{glyph}}</span><sc-if value="{{hasNum}}" hint-placeholder-val="{{true}}"><span style="font-family: 'Literata', Georgia, serif; font-weight: 600; font-size: {{dpx}}; line-height: 1">{{num}}</span></sc-if></span>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"glyph":{"editor":"text","default":"௰"},"num":{"editor":"text","default":"10"},"tone":{"editor":"enum","default":"clay","options":["clay","rose","indigo","green"]},"earned":{"editor":"boolean","default":true},"shine":{"editor":"boolean","default":false},"px":{"editor":"int","default":120,"min":40,"max":320},"$preview":{"width":120,"height":136}}'>
/* A seal: a brass rim, an enamel face coloured by its kind, two ribbon tails. Clay for pages, rose for the thread, indigo for Tamil, green for the times of day and the three parts. */
var TONES = { clay: ['#D2714A', '#8E3418', '#6E2810'], rose: ['#D65473', '#8A2238', '#6C1A2C'], indigo: ['#5C72B8', '#26366A', '#1B2852'], green: ['#4E9A79', '#1D4B3B', '#143A2D'] };
class Component extends DCLogic {
  renderVals() {
    var p = this.props, g = p.glyph || '௰', px = Number(p.px || 120), k = px / 120;
    var earned = p.earned === true || p.earned === 'true' || (p.earned === undefined && p.ahead !== true && p.ahead !== 'true');
    var tone = TONES[p.tone] ? p.tone : 'clay', c = TONES[tone];
    var base = g.length > 3 ? 15 : g.length > 1 ? 26 : (p.num ? 36 : 44);
    return {
      glyph: g, num: p.num || '', hasNum: !!p.num, earned: earned, ahead: !earned, tone: tone, c1: c[0], c2: c[1], c3: c[2],
      px: px, pxh: Math.round(px * 136 / 120), box: px + 'px', boxh: Math.round(px * 136 / 120) + 'px', facebox: Math.round(116 * k) + 'px',
      fpx: Math.round(base * k) + 'px', dpx: Math.round(14 * k) + 'px', gap: Math.round(4 * k) + 'px',
      cls: p.shine ? ' shiny' : ''
    };
  }
}
</script>
</body>
</html>
