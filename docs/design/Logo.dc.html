<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wdth,wght@75..125,100..800&amp;family=Tiro+Tamil:ital@0;1&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1120px; height: 620px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; font-family: 'Anek Tamil', system-ui, sans-serif; color: #17131F">
<sc-for list="{{logos}}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 18px">
<p style="margin: 0; font-size: 19px; line-height: 40px; font-weight: 500">{{g.name}}</p>
<dc-import name="LogoMark" kind="{{g.id}}" size="240" tile="{{true}}" hint-size="240px,240px"></dc-import>
<div style="display: flex; align-items: flex-end; gap: 18px">
<dc-import name="LogoMark" kind="{{g.id}}" size="96" tile="{{true}}" hint-size="96px,96px"></dc-import>
<dc-import name="LogoMark" kind="{{g.id}}" size="56" tile="{{true}}" hint-size="56px,56px"></dc-import>
<dc-import name="LogoMark" kind="{{g.id}}" size="32" tile="{{true}}" hint-size="32px,32px"></dc-import>
</div>
<div style="display: flex; align-items: center; gap: 14px; background: #17131F; color: #F5EFE6; border-radius: 16px; padding: 14px 18px; width: 240px; box-sizing: border-box">
<dc-import name="LogoMark" kind="{{g.id}}" size="40" tile="{{false}}" hint-size="40px,40px"></dc-import>
<span style="font-family: 'Tiro Tamil', serif; font-size: 25px; white-space: nowrap">Kural Heart</span>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    return { logos: [
      { id: 'rising', name: '1. Rising heart' },
      { id: 'leaves', name: '2. Two leaves' },
      { id: 'ku', name: '3. கு in the sun' }
    ] };
  }
}
</script>
</body>
</html>
